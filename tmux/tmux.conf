# Souris
set -g mouse on

# Historique
set -g history-limit 100000

# Numérotation des fenêtres/panes à partir de 1 (au lieu de 0)
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Fenêtre nommée d'après le titre du terminal (ex. nom de conversation Claude Code) quand le
# process actif ressemble à un numéro de version (x.y.z) ou que le pane s'annonce comme le todo
# (sinon on lirait "Python"), sinon comportement normal (nom du process)
set -g automatic-rename-format '#{?pane_in_mode,[tmux],#{?#{||:#{m:*.*.*,#{pane_current_command}},#{m:todo*,#{pane_title}}},#{pane_title},#{pane_current_command}}}#{?pane_dead,[dead],}'

# Terminal / couleurs
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Clipboard macOS
set -s set-clipboard on

# Passthrough vers le terminal hôte (notifications desktop + progress bar de Claude Code, sinon avalées par tmux)
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Notifications fenêtres (ex. cloche terminal de Claude Code en fin de réponse)
set -g monitor-bell on
set -g monitor-activity on
set -g visual-bell off
# set -g bell-action other   # ne notifie que les fenêtres où tu n'es pas (désactivé : notifie partout)

# TPM
set -g @plugin 'tmux-plugins/tpm'

# Copie clipboard uniformisée (mode vi)
set -g @plugin 'tmux-plugins/tmux-yank'

# tmux2k
set -g @plugin '2kabhishek/tmux2k'
set -g @tmux2k-theme 'catppuccin'
set -g @tmux2k-icons-only true

set -g @tmux2k-left-plugins "session cwd git tasks"
set -g @tmux2k-right-plugins "cpu ram battery network time"

# Icône tasks (todo.txt, ~/todo.txt) dans la barre gauche — plugin custom en jumeau de tdo.sh,
# cf tasks.sh (source de vérité ~/.tim/tmux/tasks.sh, recopié dans le clone TPM par install_tmux.sh)
set -g @tmux2k-tasks-colors "text yellow"
set -g @tmux2k-tasks-popup-cmd "todo"

set -g @tmux2k-time-format "%H:%M"

# ram_popup essaie htop avant btop par défaut, on force btop pour les deux (cohérence + déjà installé)
set -g @tmux2k-cpu-popup-cmd "btop"
set -g @tmux2k-ram-popup-cmd "btop"

# Popups par défaut de cwd/network/time ciblent des outils Linux-only ou non installés → erreur
# "returned 1". On les remplace par des commandes déjà natives macOS.
set -g @tmux2k-cwd-popup-cmd "ls -la; read -n 1"
# networksetup -getairportnetwork est peu fiable depuis macOS Sonoma (accès Localisation requis) ;
# ipconfig getsummary donne l'état réel de la connexion sans ce blocage
set -g @tmux2k-network-popup-cmd "ipconfig getsummary en0 | grep -E 'SSID|LinkStatusActive|State :'; read -n 1"
set -g @tmux2k-time-popup-cmd "cal -3; read -n 1"

set -g @tmux2k-window-list-alignment "absolute-centre"
# Icône d'état Claude Code après le nom de fenêtre (◐ en cours de génération, ✳ idle/waiting) —
# cf claude_state.sh, no-op sur les fenêtres qui n'hébergent pas un process Claude Code (x.y.z)
set -g @tmux2k-window-list-format "#I:#W #(~/.tim/tmux/claude_state.sh #{pane_id})"

set -g @tmux2k-refresh-rate 5

# Nouvelle fenêtre dans le cwd du pane courant (par défaut prefix+c repart dans $HOME)
bind-key c new-window -c "#{pane_current_path}"

# Popup todo (remplace prefix+t clock-mode, peu utile)
bind-key t display-popup -E -w 90% -h 90% -T " tasks " "todo"

# TPM — toujours à la fin
run '~/.tmux/plugins/tpm/tpm'

# Restaure le clic natif tmux pour changer d'onglet (tmux2k rebind ce clic vers ses popups)
bind-key -n MouseDown1Status select-window -t=
